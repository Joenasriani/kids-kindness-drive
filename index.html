<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Kindness Cruiser</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Fredoka+One&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #eff6ff; /* blue-50 */
            touch-action: none; /* Prevent pull-to-refresh on mobile */
        }

        .font-fredoka {
            font-family: 'Fredoka One', cursive;
        }
        
        .font-chewy {
            font-family: 'Chewy', cursive;
        }

        /* Custom Animations */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes titleBounce {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(5deg); }
            70% { transform: scale(0.9) rotate(-3deg); }
            100% { transform: scale(1) rotate(-2deg); opacity: 1; }
        }
        .animate-title {
            animation: titleBounce 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        /* Safe area handling for iPhones */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .top-safe {
            top: env(safe-area-inset-top);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- ICONS (Inline SVGs to avoid dependencies) ---
        const Heart = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
            </svg>
        );
        const Star = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
            </svg>
        );
        const Book = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
            </svg>
        );
        const Sun = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" />
            </svg>
        );
        const Trophy = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
                <path d="M4 22h16" />
                <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
                <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
                <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
            </svg>
        );
        const Play = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
        );
        const Volume2 = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
            </svg>
        );
        const VolumeX = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                <line x1="23" y1="9" x2="17" y2="15" />
                <line x1="17" y1="9" x2="23" y2="15" />
            </svg>
        );
        const RotateCcw = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
            </svg>
        );

        // --- GAME CONSTANTS & TEXT BANKS ---
        const SPAWN_RATE = 1500;
        const LANE_COUNT = 3;
        const CAR_Y_POS = 82; 
        const MAX_MISSES = 3;

        const ITEM_TYPES = [
            { type: 'heart', icon: <Heart className="text-red-500 fill-current w-full h-full" />, score: 10, color: 'bg-red-100' },
            { type: 'star', icon: <Star className="text-yellow-500 fill-current w-full h-full" />, score: 15, color: 'bg-yellow-100' },
            { type: 'book', icon: <Book className="text-blue-500 fill-current w-full h-full" />, score: 20, color: 'bg-blue-100' },
            { type: 'sun', icon: <Sun className="text-orange-500 fill-current w-full h-full" />, score: 25, color: 'bg-orange-100' },
        ];

        // EXPANDED BANK 1: Good Habits
        const GOOD_HABITS_BANK = [
            // User Requests & Core Habits
            "Sit Up Straight", "Clean My Room", "Don't Talk to Strangers", "Be Nice", "Shower Everyday",
            "Eat Healthy", "Brush Teeth", "Share Toys", "Say Please", "Eat Veggies", 
            "Help Mom", "Do Homework", "Be Kind", "Listen Well", "Help Dad", 
            
            // Daily Routine
            "Drink Water", "Read Books", "Say Thank You", "Wash Hands", "Make Bed", 
            "Feed Pets", "Hug Family", "Smile Big", "Be Brave", "Tell Truth", 
            "Recycle", "Plant Trees", "Exercise", "Sleep Early", "Use Words", 
            
            // Social & Safety
            "Be Patient", "Take Turns", "Say Sorry", "High Five", "Good Manners", 
            "Love Yourself", "Help Friends", "Don't Litter", "Be Polite", "Play Outside", 
            "Draw a Picture", "Sing a Song", "Dance Freely", "Save Water", "Recycle Paper", 
            
            // More Habits
            "Plant a Flower", "Be Honest", "Say Hello", "Share Snacks", "Take a Nap", 
            "Eat Fruit", "Drink Milk", "Brush Hair", "Wash Face", "Tie Shoes", 
            "Clean Toys", "Pet the Dog", "Feed the Cat", "Call Grandma", "Write a Letter", 
            "Say I Love You", "Be Happy", "Try Your Best", "Learn New Things", "Ask for Help", 
            
            // Etiquette & Safety
            "Be Gentle", "Use a Tissue", "Cover Mouth", "Say Excuse Me", "Wait Your Turn", 
            "Listen to Teacher", "Be a Leader", "Follow Rules", "Be Safe", "Look Both Ways", 
            "Wear Helmet", "Hold Hands", "Be Calm", "Breathe Deep", "Respect Others",
            "Buckle Up", "Do Chores", "Put Away Clothes", "Don't Interrupt", "Forgive Others"
        ];

        // EXPANDED BANK 2: Positive Reinforcement
        const PRAISE_BANK = [
            "GREAT JOB!", "NICE!", "OH WOW!", "YOU'RE DOING IT!", "YES!",
            "SUPER!", "AMAZING!", "KEEP IT UP!", "WAY TO GO!", "FANTASTIC!",
            "AWESOME!", "YOU ROCK!", "BRILLIANT!", "SO SMART!", "SUPER STAR!",
            "YOU GOT THIS!", "HOORAY!", "WONDERFUL!", "EXCELLENCE!", "PERFECT!",
            "SO FAST!", "HERO!", "CHAMPION!", "LEGEND!", "KIND HEART!",
            "SPECTACULAR!", "INCREDIBLE!", "MARVELOUS!", "STUPENDOUS!", "OUTSTANDING!",
            "BRILLIANT WORK!", "SO GOOD!", "TOP NOTCH!", "FIRST CLASS!", "WORLD CLASS!",
            "HEROIC!", "SUPERB!", "EXCELLENT!", "BRAVO!", "TAKE A BOW!",
            "SHINING BRIGHT!", "PURE GOLD!", "MAGIC!", "UNSTOPPABLE!", "ON FIRE!",
            "WINNING!", "SO PROUD!", "LOVELY!", "BEAUTIFUL!", "SMART COOKIE!",
            "GENIUS!", "WHIZ KID!", "SPEEDY!", "ZOOM!", "WOWZA!", "YIPPEE!", "WOOHOO!"
        ];

        // EXPANDED BANK 3: Gentle Game Over Messages
        const GENTLE_END_BANK = [
            "You spread so much joy!",
            "Great effort! Time to rest.",
            "Amazing driving! Take a break.",
            "You did wonderful things!",
            "Rest up and play again!",
            "What a happy journey!",
            "You are a kindness hero!",
            "The world is brighter now!",
            "Good driving, helper!",
            "Thanks for playing!",
            "You made the world better!",
            "What a kind heart you have!",
            "You are a special person!",
            "Thanks for spreading love!",
            "You are loved!",
            "Have a wonderful rest!",
            "Dream big dreams!",
            "You are important!",
            "Keep being you!",
            "You are strong!",
            "You are smart!",
            "You are kind!",
            "See you soon!",
            "Come back soon!",
            "We love you!",
            "Big hugs!",
            "High five!",
            "Great try!",
            "Almost there!",
            "You did your best!"
        ];

        function KindnessCruiser() {
            const [gameState, setGameState] = useState('start'); // start, countdown, playing, gameover
            const [count, setCount] = useState(3);
            const [lane, setLane] = useState(1); 
            const [items, setItems] = useState([]);
            const [score, setScore] = useState(0);
            const [missed, setMissed] = useState(0);
            const [feedback, setFeedback] = useState(null);
            const [level, setLevel] = useState(1);
            const [isMuted, setIsMuted] = useState(false);
            const [finalMessage, setFinalMessage] = useState("");
            
            const gameLoopRef = useRef();
            const lastSpawnRef = useRef(0);
            const audioCtxRef = useRef(null);

            // --- Audio System ---
            const initAudio = useCallback(() => {
                if (!audioCtxRef.current) {
                    audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtxRef.current.state === 'suspended') {
                    audioCtxRef.current.resume();
                }
            }, []);

            const playSound = useCallback((type) => {
                if (isMuted || !audioCtxRef.current) return;

                const ctx = audioCtxRef.current;
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                
                osc.connect(gainNode);
                gainNode.connect(ctx.destination);

                const now = ctx.currentTime;

                if (type === 'move') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                    gainNode.gain.setValueAtTime(0.15, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } 
                else if (type === 'collect') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                    gainNode.gain.setValueAtTime(0.1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    
                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.type = 'triangle';
                    osc2.frequency.setValueAtTime(1000, now);
                    gain2.gain.setValueAtTime(0.05, now);
                    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc2.start(now);
                    osc2.stop(now + 0.2);
                }
                else if (type === 'levelup') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(600, now + 0.2);
                    osc.frequency.linearRampToValueAtTime(900, now + 0.4);
                    gainNode.gain.setValueAtTime(0.2, now);
                    gainNode.gain.linearRampToValueAtTime(0.2, now + 0.4);
                    gainNode.gain.linearRampToValueAtTime(0.001, now + 1.0);
                    osc.start(now);
                    osc.stop(now + 1.0);
                }
                else if (type === 'gameover') {
                    // Happy "Win" Fanfare
                    const notes = [523.25, 659.25, 783.99, 1046.50]; 
                    notes.forEach((freq, i) => {
                        const noteOsc = ctx.createOscillator();
                        const noteGain = ctx.createGain();
                        noteOsc.connect(noteGain);
                        noteGain.connect(ctx.destination);
                        noteOsc.type = 'triangle';
                        noteOsc.frequency.setValueAtTime(freq, now + (i * 0.1));
                        noteGain.gain.setValueAtTime(0, now + (i * 0.1));
                        noteGain.gain.linearRampToValueAtTime(0.15, now + (i * 0.1) + 0.05);
                        noteGain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.1) + 0.8);
                        noteOsc.start(now + (i * 0.1));
                        noteOsc.stop(now + (i * 0.1) + 1.0);
                    });
                }
                else if (type === 'countdown') {
                    // Short blip for 3, 2, 1
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    gainNode.gain.setValueAtTime(0.1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                }
                else if (type === 'go') {
                    // Higher pitch for GO!
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(880, now);
                    gainNode.gain.setValueAtTime(0.1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            }, [isMuted]);

            // --- Countdown Logic ---
            useEffect(() => {
                if (gameState === 'countdown') {
                    if (count > 0) {
                        playSound('countdown');
                        const timer = setTimeout(() => setCount(c => c - 1), 1000);
                        return () => clearTimeout(timer);
                    } else {
                        playSound('go');
                        const timer = setTimeout(() => {
                            setGameState('playing');
                        }, 1000); // Show GO for 1 second
                        return () => clearTimeout(timer);
                    }
                }
            }, [gameState, count, playSound]);

            // --- Game Logic ---
            const triggerFeedback = (text, type) => {
                setFeedback({ text, type, id: Date.now() });
                setTimeout(() => setFeedback(null), 1200);
            };

            const moveLeft = useCallback(() => {
                if (gameState !== 'playing') return;
                playSound('move');
                setLane((prev) => Math.max(0, prev - 1));
            }, [gameState, playSound]);

            const moveRight = useCallback(() => {
                if (gameState !== 'playing') return;
                playSound('move');
                setLane((prev) => Math.min(LANE_COUNT - 1, prev + 1));
            }, [gameState, playSound]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (gameState !== 'playing') return;
                    if (e.key === 'ArrowLeft') moveLeft();
                    if (e.key === 'ArrowRight') moveRight();
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [gameState, moveLeft, moveRight]);

            const updateGame = useCallback((timestamp) => {
                if (gameState !== 'playing') return;

                if (timestamp - lastSpawnRef.current > SPAWN_RATE / (1 + level * 0.1)) {
                    const template = ITEM_TYPES[Math.floor(Math.random() * ITEM_TYPES.length)];
                    const habitText = GOOD_HABITS_BANK[Math.floor(Math.random() * GOOD_HABITS_BANK.length)];
                    
                    const newItem = {
                        id: Date.now(),
                        lane: Math.floor(Math.random() * LANE_COUNT),
                        y: -20,
                        text: habitText,
                        ...template
                    };
                    
                    setItems(prev => [...prev, newItem]);
                    lastSpawnRef.current = timestamp;
                }

                setItems(prevItems => {
                    const nextItems = [];
                    let itemsMissedNow = 0;

                    prevItems.forEach(item => {
                        const nextY = item.y + (0.4 + level * 0.05);
                        
                        const hitCar = nextY > CAR_Y_POS - 5 && nextY < CAR_Y_POS + 5 && item.lane === lane;

                        if (hitCar) {
                            playSound('collect');
                            const randomPhrase = PRAISE_BANK[Math.floor(Math.random() * PRAISE_BANK.length)];
                            triggerFeedback(randomPhrase, 'good');
                            
                            setScore(s => {
                                const newScore = s + item.score;
                                if (Math.floor(newScore / 100) > Math.floor(s / 100)) {
                                    setLevel(l => l + 1);
                                    triggerFeedback("Level Up!", "good");
                                    playSound('levelup');
                                }
                                return newScore;
                            });
                            return; 
                        }

                        if (nextY > 110) {
                            itemsMissedNow++;
                        } else {
                            nextItems.push({ ...item, y: nextY });
                        }
                    });

                    if (itemsMissedNow > 0) {
                        setMissed(prev => {
                            const newMissed = prev + itemsMissedNow;
                            if (newMissed >= MAX_MISSES) {
                                const endMsg = GENTLE_END_BANK[Math.floor(Math.random() * GENTLE_END_BANK.length)];
                                setFinalMessage(endMsg);
                                setGameState('gameover');
                                playSound('gameover');
                            }
                            return newMissed;
                        });
                    }

                    return nextItems;
                });

                gameLoopRef.current = requestAnimationFrame(updateGame);
            }, [gameState, lane, level, playSound]);

            useEffect(() => {
                if (gameState === 'playing') {
                    lastSpawnRef.current = performance.now();
                    gameLoopRef.current = requestAnimationFrame(updateGame);
                }
                return () => cancelAnimationFrame(gameLoopRef.current);
            }, [gameState, updateGame]);

            const startGame = () => {
                initAudio();
                setGameState('countdown'); // Switch to countdown instead of playing
                setCount(3);
                setScore(0);
                setMissed(0);
                setLevel(1);
                setItems([]);
                setLane(1);
            };

            return (
                <div className="relative w-full h-[100dvh] bg-blue-50 overflow-hidden font-sans touch-none select-none flex justify-center">
                    
                    {/* Background Decor - Responsive widths */}
                    <div className="absolute inset-y-0 left-0 w-4 sm:w-8 md:w-32 bg-green-400 z-0 transition-all"></div>
                    <div className="absolute inset-y-0 right-0 w-4 sm:w-8 md:w-32 bg-green-400 z-0 transition-all"></div>

                    {/* Road Container - Max width for desktop */}
                    <div className="relative w-full max-w-lg md:max-w-2xl h-full bg-gray-700 mx-auto border-l-4 border-r-4 border-white z-0">
                        <div className="absolute inset-0 flex justify-between px-[33%]">
                            <div className="h-full border-r-4 border-dashed border-white opacity-50"></div>
                            <div className="h-full border-r-4 border-dashed border-white opacity-50"></div>
                        </div>
                    </div>

                    {/* Header UI - Responsive Layout */}
                    <div className="absolute top-0 left-0 right-0 p-2 sm:p-4 md:p-6 z-20 flex justify-between items-start pointer-events-none w-full max-w-5xl mx-auto top-safe">
                        {/* Score */}
                        <div className="bg-white/95 backdrop-blur px-3 py-2 md:px-6 md:py-4 rounded-xl md:rounded-2xl shadow-xl border-b-4 border-blue-300 min-w-[70px] md:min-w-[90px] text-center transform scale-90 md:scale-100 origin-top-left">
                            <div className="text-[10px] md:text-xs text-gray-500 uppercase font-extrabold tracking-wider">Score</div>
                            <div className="text-xl md:text-4xl font-black text-blue-600 leading-none">{score}</div>
                        </div>
                        
                        {/* Hearts/Lives - Responsive sizing */}
                        <div className="bg-white/95 backdrop-blur px-3 py-2 rounded-full shadow-lg border-2 border-gray-200 flex gap-1 md:gap-2 items-center">
                        {[...Array(MAX_MISSES)].map((_, i) => (
                            <Heart 
                                key={i} 
                                className={`w-5 h-5 sm:w-6 sm:h-6 md:w-8 md:h-8 transition-colors duration-300 ${i < (MAX_MISSES - missed) ? 'text-red-500 fill-red-500' : 'text-gray-300 fill-gray-300'}`} 
                            />
                        ))}
                        </div>

                        {/* Right Group: Level & Mute */}
                        <div className="flex gap-2 items-start pointer-events-auto">
                            <div className="bg-white/95 backdrop-blur px-3 py-2 md:px-6 md:py-4 rounded-xl md:rounded-2xl shadow-xl border-b-4 border-red-300 min-w-[70px] md:min-w-[90px] text-center transform scale-90 md:scale-100 origin-top-right">
                                <div className="text-[10px] md:text-xs text-gray-500 uppercase font-extrabold tracking-wider">Level</div>
                                <div className="text-xl md:text-4xl font-black text-red-600 leading-none">{level}</div>
                            </div>

                            <button 
                                onClick={() => setIsMuted(!isMuted)}
                                className="bg-white/95 p-2 sm:p-3 md:p-4 rounded-full shadow-lg border-2 border-gray-200 hover:bg-gray-50 active:scale-95 transition-transform"
                            >
                                {isMuted ? <VolumeX className="w-4 h-4 sm:w-5 sm:h-5 md:w-6 md:h-6 text-gray-400" /> : <Volume2 className="w-4 h-4 sm:w-5 sm:h-5 md:w-6 md:h-6 text-blue-600" />}
                            </button>
                        </div>
                    </div>

                    {/* Game Items Layer */}
                    <div className="absolute inset-0 flex justify-center z-10 pointer-events-none">
                        <div className="relative w-full max-w-lg md:max-w-2xl h-full mx-auto">
                        
                        <div className="absolute inset-y-0 left-0 right-0 flex">
                            {[0, 1, 2].map((laneIndex) => (
                            <div key={laneIndex} className="relative w-1/3 h-full">
                                {items.filter(item => item.lane === laneIndex).map(item => (
                                <div
                                    key={item.id}
                                    className={`absolute left-1/2 transform -translate-x-1/2 -translate-y-1/2 transition-transform duration-75 
                                    rounded-full shadow-lg ${item.color} border-2 border-white
                                    flex items-center justify-center
                                    /* Responsive sizes for items */
                                    w-10 h-10 sm:w-14 sm:h-14 md:w-20 md:h-20`} 
                                    style={{ top: `${item.y}%` }}
                                >
                                    <div className="absolute -top-6 sm:-top-8 left-1/2 transform -translate-x-1/2 whitespace-nowrap 
                                    bg-white/95 px-2 py-1 rounded-lg shadow-md border border-blue-100 
                                    text-[9px] sm:text-xs md:text-sm font-bold text-gray-700 z-10">
                                    {item.text}
                                    </div>
                                    <div className="w-3/4 h-3/4 flex items-center justify-center">
                                        {item.icon}
                                    </div>
                                </div>
                                ))}
                            </div>
                            ))}
                        </div>

                        {/* Player Car - Scaled appropriately */}
                        <div className="absolute left-0 right-0 bottom-0 h-full flex items-end pb-24 sm:pb-32 md:pb-12 transition-all duration-200 ease-out">
                            <div 
                            className="absolute transition-all duration-200 ease-out w-1/3 flex justify-center"
                            style={{ 
                                left: `${lane * 33.33}%`,
                                bottom: `${100 - CAR_Y_POS - 5}%` 
                            }}
                            >
                            <div className="relative transform scale-75 sm:scale-90 md:scale-100 origin-bottom hover:scale-105 transition-transform duration-100">
                                <div className="w-14 h-20 sm:w-16 sm:h-24 md:w-20 md:h-32 bg-red-500 rounded-3xl shadow-xl relative border-b-8 border-red-700 z-10 flex flex-col items-center justify-center">
                                <div className="w-[80%] h-6 sm:h-8 md:h-12 bg-blue-300 rounded-lg mb-2 border-2 border-blue-400/50"></div>
                                <div className="w-6 sm:w-8 h-3 sm:h-4 border-b-4 border-white rounded-full"></div>
                                </div>
                                {/* Wheels */}
                                <div className="absolute -left-1 sm:-left-2 top-4 w-3 sm:w-4 h-6 sm:h-8 bg-black rounded-l-lg"></div>
                                <div className="absolute -right-1 sm:-right-2 top-4 w-3 sm:w-4 h-6 sm:h-8 bg-black rounded-r-lg"></div>
                                <div className="absolute -left-1 sm:-left-2 bottom-4 w-3 sm:w-4 h-6 sm:h-8 bg-black rounded-l-lg"></div>
                                <div className="absolute -right-1 sm:-right-2 bottom-4 w-3 sm:w-4 h-6 sm:h-8 bg-black rounded-r-lg"></div>
                                {/* Lights */}
                                <div className="absolute top-1 left-2 w-2 sm:w-3 h-2 sm:h-3 bg-yellow-200 rounded-full animate-pulse"></div>
                                <div className="absolute top-1 right-2 w-2 sm:w-3 h-2 sm:h-3 bg-yellow-200 rounded-full animate-pulse"></div>
                            </div>
                            </div>
                        </div>
                        </div>
                    </div>

                    {/* Countdown Overlay */}
                    {gameState === 'countdown' && (
                        <div className="absolute inset-0 z-50 flex items-center justify-center pointer-events-none">
                        <div key={count} className="animate-pop">
                            <div className={`
                            text-9xl md:text-[12rem] font-fredoka font-black 
                            ${count > 0 ? 'text-yellow-400' : 'text-green-500'} 
                            drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)] 
                            stroke-black stroke-2
                            `} style={{ textShadow: '4px 4px 0 #000' }}>
                            {count > 0 ? count : "GO!"}
                            </div>
                        </div>
                        </div>
                    )}

                    {/* Feedback Popup */}
                    {feedback && (
                        <div className="absolute top-1/4 left-0 right-0 flex justify-center z-50 pointer-events-none px-4">
                        <div className="px-4 py-2 sm:px-6 sm:py-3 rounded-full text-lg sm:text-2xl md:text-3xl font-black text-white shadow-2xl border-4 border-white whitespace-nowrap bg-green-500 animate-pop">
                            {feedback.text}
                        </div>
                        </div>
                    )}

                    {/* Start Screen - Responsive Text & Layout */}
                    {gameState === 'start' && (
                        <div className="absolute inset-0 bg-blue-600/90 z-50 flex flex-col items-center justify-center p-4 text-center backdrop-blur-sm">
                        <div className="bg-white p-6 sm:p-10 rounded-[2rem] shadow-2xl max-w-sm md:max-w-lg w-full animate-pop border-b-8 border-gray-100">
                            <div className="flex justify-center mb-4 sm:mb-6">
                            <div className="p-3 sm:p-4 bg-yellow-100 rounded-full animate-pulse">
                                <Trophy className="w-12 h-12 sm:w-16 sm:h-16 text-yellow-500" />
                            </div>
                            </div>
                            {/* Fredoka One Font - Responsive Sizes */}
                            <h1 className="text-5xl sm:text-6xl md:text-8xl font-fredoka text-transparent bg-clip-text bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 mb-4 sm:mb-6 drop-shadow-sm tracking-wide animate-title leading-tight">
                            KINDNESS<br/>CRUISER
                            </h1>
                            
                            <div className="text-gray-500 mb-6 sm:mb-8 font-medium flex flex-col items-center gap-1 sm:gap-2 text-sm sm:text-base">
                            <span>Catch the good habits!</span>
                            {/* Subtitle color matched to title gradient */}
                            <span className="text-xl sm:text-2xl md:text-3xl font-black animate-pulse text-transparent bg-clip-text bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600">
                                Don't let 3 habits<br/>slip away!
                            </span>
                            </div>
                            
                            <button 
                            onClick={startGame}
                            className="w-full bg-green-500 hover:bg-green-600 text-white text-lg sm:text-xl font-bold py-3 sm:py-4 rounded-2xl shadow-lg border-b-4 border-green-700 active:border-b-0 active:translate-y-1 transition-all flex items-center justify-center gap-3"
                            >
                            <Play fill="currentColor" className="w-5 h-5 sm:w-6 sm:h-6" /> START
                            </button>
                        </div>
                        </div>
                    )}

                    {/* Game Over Screen */}
                    {gameState === 'gameover' && (
                        <div className="absolute inset-0 bg-purple-600/90 z-50 flex flex-col items-center justify-center p-4 text-center backdrop-blur-sm">
                        <div className="bg-white p-6 sm:p-8 rounded-[2rem] shadow-2xl max-w-sm w-full animate-pop border-b-8 border-purple-100">
                            <div className="flex justify-center mb-4 sm:mb-6">
                            <div className="p-3 sm:p-4 bg-green-100 rounded-full">
                                <Heart className="w-12 h-12 sm:w-16 sm:h-16 text-green-500 fill-current animate-pulse" />
                            </div>
                            </div>
                            <h2 className="text-xl sm:text-2xl font-black text-gray-800 mb-2">
                            {finalMessage}
                            </h2>
                            <div className="my-4 sm:my-6 p-4 bg-blue-50 rounded-xl">
                            <div className="text-xs sm:text-sm text-gray-500 uppercase font-bold tracking-wider">Final Score</div>
                            <div className="text-4xl sm:text-5xl font-black text-blue-600">{score}</div>
                            </div>
                            
                            <button 
                            onClick={startGame}
                            className="w-full bg-blue-500 hover:bg-blue-600 text-white text-lg sm:text-xl font-bold py-3 sm:py-4 rounded-2xl shadow-lg border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 transition-all flex items-center justify-center gap-3"
                            >
                            <RotateCcw className="w-5 h-5 sm:w-6 sm:h-6" /> PLAY AGAIN
                            </button>
                        </div>
                        </div>
                    )}

                    {/* Controls Overlay - Touch Friendly */}
                    {gameState === 'playing' && (
                        <div className="absolute inset-x-0 bottom-0 pb-safe z-40">
                        <div className="flex justify-center gap-4 px-4 pb-4 md:pb-8 w-full max-w-lg mx-auto h-24 sm:h-32 md:h-24">
                            <button 
                            className="flex-1 bg-white/20 hover:bg-white/30 backdrop-blur-md rounded-2xl border-2 border-white/50 shadow-lg active:bg-white/40 active:scale-95 transition-all flex items-center justify-center group"
                            onPointerDown={(e) => { e.preventDefault(); moveLeft(); }}
                            aria-label="Move Left"
                            >
                            <div className="w-0 h-0 border-t-[12px] md:border-t-[15px] border-t-transparent border-r-[20px] md:border-r-[25px] border-r-white border-b-[12px] md:border-b-[15px] border-b-transparent opacity-90 group-hover:scale-110 transition-transform"></div>
                            </button>
                            <button 
                            className="flex-1 bg-white/20 hover:bg-white/30 backdrop-blur-md rounded-2xl border-2 border-white/50 shadow-lg active:bg-white/40 active:scale-95 transition-all flex items-center justify-center group"
                            onPointerDown={(e) => { e.preventDefault(); moveRight(); }}
                            aria-label="Move Right"
                            >
                            <div className="w-0 h-0 border-t-[12px] md:border-t-[15px] border-t-transparent border-l-[20px] md:border-l-[25px] border-l-white border-b-[12px] md:border-b-[15px] border-b-transparent opacity-90 group-hover:scale-110 transition-transform"></div>
                            </button>
                        </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<KindnessCruiser />);
    </script>
</body>
</html>
