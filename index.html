<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kindness Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --game-unit: 1vmin;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #fecaca;
            touch-action: none;
            overscroll-behavior: none;
            font-family: 'Fredoka One', cursive;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes titleBounce {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(5deg); }
            70% { transform: scale(0.95) rotate(-3deg); }
            100% { transform: scale(1) rotate(-2deg); opacity: 1; }
        }
        .animate-title {
            animation: titleBounce 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
        .road-surface {
            transform: rotateX(5deg);
            transform-origin: top;
        }
        /* Proportional Scaling Utilities */
        .text-fluid-title { font-size: calc(var(--game-unit) * 10); }
        .text-fluid-subtitle { font-size: calc(var(--game-unit) * 4); }
        .text-fluid-hud { font-size: calc(var(--game-unit) * 3.5); }
        .text-fluid-label { font-size: calc(var(--game-unit) * 1.8); }
        .text-fluid-item { font-size: calc(var(--game-unit) * 2.5); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const MAX_MISSES = 5;
        const LANE_COUNT = 3;
        const CAR_Y_POS = 82;

        const GOOD_HABITS_BANK = [
            "Clean my room", "Be nice", "Sit upright", "Eat healthy", 
            "Brush teeth", "Share toys", "Say please", "Eat veggies", "Help Mom", 
            "Do homework", "Be kind", "Listen well", 
            "Read books", "Say thank you", "Wash hands", "Make bed", "Feed pets", 
            "Smile big", "Be brave", "Tell truth", "Recycle", "Plant trees",
            "Donate toys", "Donate books", "Offer to help", "Clean up", "Volunteer",
            "Be grateful", "Tell the Truth", "Care for animals", "Be patient", 
            "Ask for help", "Use kind words", "Appreciate differences"
        ];
        
        const BAD_DEEDS_BANK = ["Be rude", "Eat anything", "Eat a lot", "Say bad words", "Dont help friends", "Talk to strangers", "Shouting", "Being mean", "Ignoring rules", "Wasting food", "Telling lies"];

        const BAD_DEEDS_ADVICE = {
            "Be rude": "Being rude hurts others' feelings. Always try to use your kindest words!",
            "Eat anything": "Eating the wrong things can make you sick. Be careful and stay healthy!",
            "Eat a lot": "Eating too much can make your tummy hurt. Balance is very important!",
            "Say bad words": "Bad words aren't kind. Use your voice to spread happy and polite words!",
            "Dont help friends": "Helping friends makes you a great friend. Always be there for them!",
            "Talk to strangers": "It's safer to only talk to people you know and trust. Always stay near parents!",
            "Shouting": "Shouting can be loud and scary for others. Try using your polite inside voice!",
            "Being mean": "Being mean makes everyone sad. Kindness is a superpower that makes everyone smile!",
            "Ignoring rules": "Rules keep us safe and happy. Let's try our best to follow them!",
            "Wasting food": "Food is special. Only take what you need!",
            "Telling lies": "Telling the truth builds trust. It is always better to be honest!"
        };

        const PRAISE_BANK = ["GREAT JOB!", "NICE!", "OH WOW!", "YES!", "SUPER!", "AMAZING!", "WAY TO GO!", "AWESOME!", "YOU ROCK!", "PERFECT!", "CHAMPION!", "KIND HEART!"];

        const Heart = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="currentColor" className={className}>
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
            </svg>
        );
        const Star = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="currentColor" className={className}>
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
            </svg>
        );
        const Book = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="currentColor" className={className}>
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
            </svg>
        );
        const Sun = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="currentColor" className={className}>
                <circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" />
            </svg>
        );

        const ICON_POOL = [
            { id: 'heart', comp: Heart },
            { id: 'star', comp: Star },
            { id: 'book', comp: Book },
            { id: 'sun', comp: Sun }
        ];

        const shuffle = (arr) => {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        };

        const CarIcon = ({ style, rotated = false }) => (
            <div style={style} className={`relative origin-center ${rotated ? 'rotate-180' : ''}`}>
                <div className="w-full h-full bg-red-500 rounded-[20%] shadow-2xl relative border-b-[0.8vmin] border-red-700 z-10 flex flex-col items-center justify-center overflow-hidden">
                    <div className="w-[80%] h-[25%] bg-blue-300 rounded-md mb-[5%] border-[0.2vmin] border-blue-400/50"></div>
                    <div className="w-[40%] h-[12%] border-b-[0.4vmin] border-white rounded-full"></div>
                </div>
                <div className="absolute -left-[8%] top-[20%] w-[10%] h-[25%] bg-black rounded-l-lg"></div>
                <div className="absolute -right-[8%] top-[20%] w-[10%] h-[25%] bg-black rounded-r-lg"></div>
                <div className="absolute -left-[8%] bottom-[20%] w-[10%] h-[25%] bg-black rounded-l-lg"></div>
                <div className="absolute -right-[8%] bottom-[20%] w-[10%] h-[25%] bg-black rounded-r-lg"></div>
                <div className="absolute top-[5%] left-[10%] w-[15%] h-[10%] bg-yellow-200 rounded-full animate-pulse"></div>
                <div className="absolute top-[5%] right-[10%] w-[15%] h-[10%] bg-yellow-200 rounded-full animate-pulse"></div>
            </div>
        );

        function App() {
            const [gameState, setGameState] = useState('start');
            const [count, setCount] = useState(3);
            const [lane, setLane] = useState(1);
            const [items, setItems] = useState([]);
            const [score, setScore] = useState(0);
            const [missed, setMissed] = useState(0);
            const [feedback, setFeedback] = useState(null);
            const [level, setLevel] = useState(1);
            const [finalMessage, setFinalMessage] = useState("");
            const [isFullscreen, setIsFullscreen] = useState(false);

            const goodPool = useRef([]);
            const badPool = useRef([]);
            const gameLoopRef = useRef();
            const lastSpawnRef = useRef(0);

            const resetGame = useCallback(() => {
                setScore(0);
                setMissed(0);
                setLevel(1);
                setItems([]);
                setLane(1);
                setCount(3);
                goodPool.current = shuffle(GOOD_HABITS_BANK);
                badPool.current = shuffle(BAD_DEEDS_BANK);
                setGameState('countdown');
            }, []);

            const toggleFullScreen = useCallback(() => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            }, []);

            useEffect(() => {
                const handleFsChange = () => setIsFullscreen(!!document.fullscreenElement);
                document.addEventListener('fullscreenchange', handleFsChange);
                return () => document.removeEventListener('fullscreenchange', handleFsChange);
            }, []);

            useEffect(() => {
                if (gameState === 'countdown') {
                    if (count > 0) {
                        const t = setTimeout(() => setCount(c => c - 1), 1000);
                        return () => clearTimeout(t);
                    } else {
                        const t = setTimeout(() => setGameState('playing'), 1000);
                        return () => clearTimeout(t);
                    }
                }
            }, [gameState, count]);

            const updateGame = useCallback((timestamp) => {
                if (gameState !== 'playing') return;

                const spawnRate = Math.max(1000, 3200 - (level * 200));
                const isWayClear = !items.some(item => item.y < 40);

                if (timestamp - lastSpawnRef.current > spawnRate && isWayClear) {
                    const selectedLane = Math.floor(Math.random() * LANE_COUNT);
                    const isSpawningBad = Math.random() < 0.35;
                    const iconChoice = ICON_POOL[Math.floor(Math.random() * ICON_POOL.length)];
                    
                    let habit, colorClass, iconColor;
                    if (isSpawningBad) {
                        if (badPool.current.length === 0) badPool.current = shuffle(BAD_DEEDS_BANK);
                        habit = badPool.current.pop();
                        colorClass = 'bg-red-600'; 
                        iconColor = 'text-white';
                    } else {
                        if (goodPool.current.length === 0) goodPool.current = shuffle(GOOD_HABITS_BANK);
                        habit = goodPool.current.pop();
                        const gColors = ['bg-blue-100', 'bg-yellow-100', 'bg-green-100'];
                        const gIconColors = ['text-blue-500', 'text-yellow-500', 'text-green-500'];
                        const colorIdx = Math.floor(Math.random() * 3);
                        colorClass = gColors[colorIdx];
                        iconColor = gIconColors[colorIdx];
                    }
                    
                    setItems(prev => [...prev, {
                        id: Math.random(),
                        lane: selectedLane,
                        y: -15,
                        text: habit,
                        Icon: iconChoice.comp,
                        color: colorClass,
                        iconColor: iconColor,
                        isBad: isSpawningBad,
                        score: isSpawningBad ? 0 : 10 + (level * 2)
                    }]);
                    lastSpawnRef.current = timestamp;
                }

                setItems(prev => {
                    const next = [];
                    let missedGoodCount = 0;
                    let hitBadDeed = false;
                    const speed = 0.15 + (level * 0.1);

                    prev.forEach(item => {
                        const nextY = item.y + speed;
                        const isPortrait = window.innerHeight > window.innerWidth;
                        const contactY = isPortrait ? 65 : 62; 
                        const hit = nextY > contactY && nextY < (CAR_Y_POS + 5) && item.lane === lane;

                        if (hit) {
                            if (item.isBad) {
                                hitBadDeed = true;
                                setFinalMessage(BAD_DEEDS_ADVICE[item.text] || "Always stay away from bad deeds!");
                                setGameState('gameover');
                            } else {
                                setFeedback({ text: PRAISE_BANK[Math.floor(Math.random() * PRAISE_BANK.length)], color: 'bg-green-500' });
                                setScore(s => {
                                    const ns = s + item.score;
                                    if (Math.floor(ns / 200) > Math.floor(s / 200)) setLevel(l => Math.min(15, l + 1));
                                    return ns;
                                });
                            }
                        } else if (nextY > 105) {
                            if (!item.isBad) missedGoodCount++;
                        } else {
                            next.push({ ...item, y: nextY });
                        }
                    });

                    if (!hitBadDeed && missedGoodCount > 0) {
                        setMissed(m => {
                            const total = m + missedGoodCount;
                            if (total >= MAX_MISSES) {
                                setFinalMessage("You missed too many good deeds! Practice makes perfect!");
                                setGameState('gameover');
                            }
                            return total;
                        });
                    }
                    return next;
                });
                gameLoopRef.current = requestAnimationFrame(updateGame);
            }, [gameState, lane, level, items]);

            useEffect(() => {
                if (gameState === 'playing') {
                    lastSpawnRef.current = 0;
                    gameLoopRef.current = requestAnimationFrame(updateGame);
                }
                return () => cancelAnimationFrame(gameLoopRef.current);
            }, [gameState, updateGame]);

            useEffect(() => {
                if (feedback) {
                    const t = setTimeout(() => setFeedback(null), 1000);
                    return () => clearTimeout(t);
                }
            }, [feedback]);

            return (
                <div className={`relative w-full h-screen overflow-hidden select-none touch-none flex justify-center transition-colors duration-1000 ${gameState === 'playing' ? 'bg-blue-300' : 'bg-red-300'}`}>
                    
                    {/* Background elements */}
                    <div className="absolute inset-0 flex justify-between bg-green-500">
                        <div className="w-[10vw] h-full bg-green-600 opacity-30"></div>
                        <div className="w-[10vw] h-full bg-green-600 opacity-30"></div>
                    </div>

                    {/* Road Container */}
                    <div className="relative w-full max-w-[95vw] md:max-w-[80vw] lg:max-w-[65vw] h-full bg-gray-700 border-x-[0.8vmin] border-white shadow-2xl overflow-hidden road-surface">
                        <div className="absolute inset-0 flex justify-evenly pointer-events-none">
                            <div className="h-full border-l-[0.4vmin] border-dashed border-white/30"></div>
                            <div className="h-full border-l-[0.4vmin] border-dashed border-white/30"></div>
                        </div>
                    </div>

                    {/* Persistent FS Toggle */}
                    <div className="absolute top-0 right-0 p-[2vmin] z-[300] pointer-events-auto pt-safe px-safe">
                        <button onClick={toggleFullScreen} className="bg-white/95 p-[1.5vmin] rounded-[2vmin] shadow-xl border-[0.3vmin] border-white text-gray-700 active:scale-90 transition-all flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" className="w-[4vmin] h-[4vmin]">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
                            </svg>
                        </button>
                    </div>

                    {/* Proportional HUD */}
                    <div className="absolute top-0 left-0 right-0 p-[2vmin] z-50 flex justify-between items-start pointer-events-none w-full max-w-[98vw] mx-auto pt-safe">
                        <div className="bg-white/95 p-[1.2vmin] px-[2.5vmin] rounded-[2vmin] shadow-2xl border-b-[0.8vmin] border-blue-500 text-center min-w-[12vmin]">
                            <div className="text-fluid-label uppercase font-black text-gray-400">Score</div>
                            <div className="text-fluid-hud font-black text-blue-600 leading-tight">{score}</div>
                        </div>

                        <div className="flex gap-[0.5vmin] bg-white/95 p-[1vmin] px-[1.5vmin] rounded-full shadow-2xl border-[0.3vmin] border-white">
                            {[...Array(MAX_MISSES)].map((_, i) => (
                                <Heart key={i} className={`w-[4vmin] h-[4vmin] ${i < (MAX_MISSES - missed) ? 'text-red-500' : 'text-gray-300'}`} />
                            ))}
                        </div>

                        <div className="bg-white/95 p-[1.2vmin] px-[2.5vmin] rounded-[2vmin] shadow-2xl border-b-[0.8vmin] border-yellow-500 text-center min-w-[12vmin] mr-[7vmin]">
                            <div className="text-fluid-label uppercase font-black text-gray-400">Level</div>
                            <div className="text-fluid-hud font-black text-yellow-600 leading-tight">{level}</div>
                        </div>
                    </div>

                    {/* Game Content */}
                    <div className="absolute inset-0 flex justify-center z-10 pointer-events-none">
                        <div className="relative w-full max-w-[95vw] md:max-w-[80vw] lg:max-w-[65vw] h-full">
                            {items.map(item => (
                                <div key={item.id} className="absolute left-0 w-1/3 flex flex-col items-center" style={{ top: `${item.y}%`, left: `${item.lane * 33.33}%` }}>
                                    <div className="bg-white/95 px-[1.5vmin] py-[0.5vmin] rounded-[1vmin] text-fluid-item font-black text-gray-800 shadow-xl border-[0.2vmin] border-blue-300 whitespace-nowrap mb-[1vmin] max-w-[90%] overflow-hidden">
                                        {item.text}
                                    </div>
                                    <div className={`${item.color} p-[1.2vmin] rounded-full shadow-2xl border-[0.5vmin] border-white w-[10vmin] h-[10vmin] flex items-center justify-center`}>
                                        <item.Icon className={`w-full h-full ${item.iconColor}`} />
                                    </div>
                                </div>
                            ))}
                            <CarIcon 
                                style={{ 
                                    position: 'absolute', 
                                    transition: 'all 0.15s ease-out', 
                                    width: '12vmin', 
                                    height: '18vmin', 
                                    left: `calc(${lane * 33.33}% + 16.66% - 6vmin)`, 
                                    bottom: `${100 - CAR_Y_POS - 5}%` 
                                }} 
                            />
                        </div>
                    </div>

                    {/* Feedback Popup */}
                    {feedback && (
                        <div className="absolute top-[35%] z-[90] flex justify-center pointer-events-none animate-pop w-full px-4">
                            <div className={`${feedback.color} px-[4vmin] py-[1.5vmin] rounded-full text-fluid-hud font-black text-white shadow-2xl border-[0.8vmin] border-white whitespace-nowrap`}>
                                {feedback.text}
                            </div>
                        </div>
                    )}

                    {/* START SCREEN */}
                    {gameState === 'start' && (
                        <div className="absolute inset-0 bg-red-700/90 z-[200] flex items-center justify-center p-[2vmin] backdrop-blur-md">
                            <div className="bg-white p-[4vmin] rounded-[4vmin] shadow-2xl max-w-[95vw] sm:max-w-[80vw] lg:max-w-[50vw] w-full h-[95dvh] flex flex-col items-center justify-evenly animate-pop border-b-[1.5vmin] border-gray-200 overflow-hidden">
                                <h1 className="text-fluid-title font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-pink-500 to-red-600 animate-title leading-none text-center">
                                    KINDNESS<br/>DRIVE
                                </h1>
                                <div className="flex-1 flex items-center justify-center min-h-0 py-[2vmin]">
                                    <CarIcon style={{ height: '35vmin', aspectRatio: '2/3' }} />
                                </div>
                                <p className="text-fluid-subtitle font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 via-pink-500 to-red-500 animate-pulse tracking-tight leading-tight text-center px-[2vmin]">
                                    Drive Kindness!<br/>Avoid Bad Deeds!
                                </p>
                                <button 
                                  onClick={() => setGameState('countdown')} 
                                  className="w-[80%] max-w-[40vmin] bg-gradient-to-r from-red-500 to-pink-600 text-white text-fluid-hud font-black py-[2.5vmin] rounded-[3vmin] shadow-2xl border-b-[1vmin] border-red-800 active:translate-y-1 active:border-b-0 transition-all flex items-center justify-center gap-[2vmin]"
                                >
                                    START
                                </button>
                            </div>
                        </div>
                    )}

                    {/* GAME OVER SCREEN */}
                    {gameState === 'gameover' && (
                        <div className="absolute inset-0 bg-red-700/95 z-[200] flex items-center justify-center p-[2vmin] backdrop-blur-xl">
                            <div className="bg-white p-[5vmin] rounded-[4vmin] shadow-2xl max-w-[95vw] sm:max-w-[80vw] lg:max-w-[50vw] w-full h-[95dvh] flex flex-col items-center justify-evenly animate-pop border-b-[1.5vmin] border-red-200">
                                <div className="flex flex-col items-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" className="w-[12vmin] h-[12vmin] text-red-500 mb-[2vmin] animate-pulse">
                                        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
                                        <line x1="12" y1="9" x2="12" y2="13" />
                                        <line x1="12" y1="17" x2="12.01" y2="17" />
                                    </svg>
                                    <h2 className="text-fluid-subtitle font-black text-gray-800 leading-tight text-center px-[2vmin]">
                                        {finalMessage}
                                    </h2>
                                </div>
                                <div className="bg-red-50 p-[3vmin] rounded-[3vmin] w-full text-center shadow-inner">
                                    <div className="text-fluid-label uppercase font-black text-gray-400 mb-[1vmin] tracking-widest">Final Score</div>
                                    <div className="text-[12vmin] font-black text-red-600 leading-none">{score}</div>
                                </div>
                                <button 
                                    onClick={() => setGameState('start')} 
                                    className="w-[80%] max-w-[40vmin] bg-gradient-to-r from-red-500 to-pink-600 text-white text-fluid-hud font-black py-[2.5vmin] rounded-[3vmin] shadow-2xl border-b-[1vmin] border-red-800 active:translate-y-1 transition-all"
                                >
                                    PLAY AGAIN
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Controls */}
                    {gameState === 'playing' && (
                        <div className="absolute inset-x-0 bottom-0 pb-safe z-50 flex justify-between gap-[5vmin] p-[3vmin] lg:p-[4vmin]">
                            <button 
                                onPointerDown={(e) => { e.preventDefault(); setLane(l => Math.max(0, l - 1)); }}
                                className="flex-1 max-w-[25vw] h-[15vmin] bg-white/20 backdrop-blur-lg rounded-[3vmin] border-[0.4vmin] border-white/50 shadow-2xl active:bg-white/40 active:scale-95 transition-all flex items-center justify-center"
                            >
                                <div className="w-0 h-0 border-y-[4vmin] border-r-[6vmin] border-y-transparent border-r-white"></div>
                            </button>
                            <button 
                                onPointerDown={(e) => { e.preventDefault(); setLane(l => Math.min(2, l + 1)); }}
                                className="flex-1 max-w-[25vw] h-[15vmin] bg-white/20 backdrop-blur-lg rounded-[3vmin] border-[0.4vmin] border-white/50 shadow-2xl active:bg-white/40 active:scale-95 transition-all flex items-center justify-center"
                            >
                                <div className="w-0 h-0 border-y-[4vmin] border-l-[6vmin] border-y-transparent border-l-white"></div>
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
