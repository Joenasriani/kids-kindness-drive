<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Kindness Cruiser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #eff6ff;
            touch-action: none;
            overscroll-behavior: none;
            font-family: 'Fredoka One', cursive;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes titleBounce {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(5deg); }
            70% { transform: scale(0.95) rotate(-3deg); }
            100% { transform: scale(1) rotate(-2deg); opacity: 1; }
        }
        .animate-title {
            animation: titleBounce 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
        .game-height {
            height: 100dvh;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const Heart = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className={className}>
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
            </svg>
        );
        const Star = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className={className}>
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
            </svg>
        );
        const Book = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className={className}>
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
            </svg>
        );
        const Sun = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className={className}>
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" />
            </svg>
        );
        const Trophy = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className={className}>
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
                <path d="M4 22h16" />
                <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
                <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
                <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
            </svg>
        );
        const PlayIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className={className}>
                <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
        );
        const Maximize = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" className={className}>
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
            </svg>
        );
        const Minimize = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" className={className}>
                <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3" />
            </svg>
        );
        const RotateCcw = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" className={className}>
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
            </svg>
        );

        const GOOD_HABITS_BANK = [
            "Clean my room", "Dont talk to strangers", "Be nice", "Shower everyday", "Sit upright", "Eat healthy",
            "Brush teeth", "Share toys", "Say please", "Eat veggies", "Help Mom", "Do homework", "Be kind", 
            "Listen well", "Help Dad", "Drink water", "Read books", "Say thank you", "Wash hands", "Make bed", 
            "Feed pets", "Hug family", "Smile big", "Be brave", "Tell truth", "Recycle", "Plant trees"
        ];

        const PRAISE_BANK = [
            "GREAT JOB!", "NICE!", "OH WOW!", "YOU'RE DOING IT!", "YES!", "SUPER!", "AMAZING!", "WAY TO GO!", 
            "AWESOME!", "YOU ROCK!", "SO SMART!", "SUPER STAR!", "PERFECT!", "CHAMPION!", "KIND HEART!"
        ];

        const GENTLE_END_BANK = [
            "You spread so much joy!", "Great effort! Time to rest.", "Amazing driving! Take a break.",
            "You did wonderful things!", "Rest up and play again!", "What a happy journey!"
        ];

        const ITEM_TYPES = [
            { type: 'heart', icon: <Heart className="text-red-500 w-full h-full" />, score: 10, color: 'bg-red-100' },
            { type: 'star', icon: <Star className="text-yellow-500 w-full h-full" />, score: 15, color: 'bg-yellow-100' },
            { type: 'book', icon: <Book className="text-blue-500 w-full h-full" />, score: 20, color: 'bg-blue-100' },
            { type: 'sun', icon: <Sun className="text-orange-500 w-full h-full" />, score: 25, color: 'bg-orange-100' },
        ];

        const LANE_COUNT = 3;
        const CAR_Y_POS = 82; 
        const MAX_MISSES = 3;

        function App() {
            const [gameState, setGameState] = useState('start'); 
            const [count, setCount] = useState(3);
            const [lane, setLane] = useState(1); 
            const [items, setItems] = useState([]);
            const [score, setScore] = useState(0);
            const [missed, setMissed] = useState(0);
            const [feedback, setFeedback] = useState(null);
            const [level, setLevel] = useState(1);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [finalMessage, setFinalMessage] = useState("");
            
            const gameLoopRef = useRef();
            const lastSpawnRef = useRef(0);

            const toggleFullScreen = useCallback(() => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                    setIsFullscreen(true);
                } else {
                    document.exitFullscreen().catch(() => {});
                    setIsFullscreen(false);
                }
            }, []);

            useEffect(() => {
                if (gameState === 'countdown') {
                    if (count > 0) {
                        const t = setTimeout(() => setCount(c => c - 1), 1000);
                        return () => clearTimeout(t);
                    } else {
                        const t = setTimeout(() => setGameState('playing'), 1000);
                        return () => clearTimeout(t);
                    }
                }
            }, [gameState, count]);

            const updateGame = useCallback((timestamp) => {
                if (gameState !== 'playing') return;

                const spawnRate = Math.max(1500, 3500 - (level * 200));
                
                // FIXED SPAWN LOGIC:
                // 1. Respect spawnRate interval.
                // 2. Ensure NO item exists in the top 45% of the screen across ANY lane.
                // This guarantees only one item is dropped at a time and maintains a huge vertical gap.
                const isWayClear = !items.some(item => item.y < 45);

                if (timestamp - lastSpawnRef.current > spawnRate && isWayClear) {
                    const selectedLane = Math.floor(Math.random() * LANE_COUNT);
                    const template = ITEM_TYPES[Math.floor(Math.random() * ITEM_TYPES.length)];
                    const habit = GOOD_HABITS_BANK[Math.floor(Math.random() * GOOD_HABITS_BANK.length)];
                    
                    setItems(prev => [...prev, {
                        id: Math.random(),
                        lane: selectedLane,
                        y: -15,
                        text: habit,
                        ...template
                    }]);
                    lastSpawnRef.current = timestamp;
                }

                setItems(prev => {
                    const next = [];
                    let missedCount = 0;
                    const speed = 0.2 + (level * 0.05);

                    prev.forEach(item => {
                        const nextY = item.y + speed;
                        const isPortrait = window.innerHeight > window.innerWidth;
                        const frontBumperThreshold = isPortrait ? (CAR_Y_POS - 14) : (CAR_Y_POS - 20); 
                        const hit = nextY > frontBumperThreshold && nextY < (CAR_Y_POS - 2) && item.lane === lane;

                        if (hit) {
                            setFeedback({ text: PRAISE_BANK[Math.floor(Math.random() * PRAISE_BANK.length)], id: Date.now() });
                            setScore(s => {
                                const ns = s + item.score;
                                if (Math.floor(ns / 150) > Math.floor(s / 150)) setLevel(l => l + 1);
                                return ns;
                            });
                        } else if (nextY > 105) {
                            missedCount++;
                        } else {
                            next.push({ ...item, y: nextY });
                        }
                    });

                    if (missedCount > 0) {
                        setMissed(m => {
                            const total = m + missedCount;
                            if (total >= MAX_MISSES) {
                                setFinalMessage(GENTLE_END_BANK[Math.floor(Math.random() * GENTLE_END_BANK.length)]);
                                setGameState('gameover');
                            }
                            return total;
                        });
                    }
                    return next;
                });

                gameLoopRef.current = requestAnimationFrame(updateGame);
            }, [gameState, lane, level, items]);

            useEffect(() => {
                if (gameState === 'playing') {
                    lastSpawnRef.current = 0;
                    gameLoopRef.current = requestAnimationFrame(updateGame);
                }
                return () => cancelAnimationFrame(gameLoopRef.current);
            }, [gameState, updateGame]);

            useEffect(() => {
                if (feedback) {
                    const t = setTimeout(() => setFeedback(null), 1000);
                    return () => clearTimeout(t);
                }
            }, [feedback]);

            const resetGame = () => {
                setScore(0);
                setMissed(0);
                setLevel(1);
                setItems([]);
                setLane(1);
                setCount(3);
                setGameState('countdown');
            };

            return (
                <div className="relative w-full game-height bg-blue-100 overflow-hidden select-none touch-none flex justify-center">
                    
                    <div className="absolute inset-y-0 left-0 w-4 md:w-24 3xl:w-48 bg-green-500 z-0"></div>
                    <div className="absolute inset-y-0 right-0 w-4 md:w-24 3xl:w-48 bg-green-500 z-0"></div>
                    <div className="relative w-full max-lg:max-w-[85vw] md:max-w-xl landscape:max-w-md 3xl:max-w-5xl h-full bg-gray-700 border-x-4 border-white z-0">
                        <div className="absolute inset-0 flex justify-between px-[33%] border-dashed border-white/30 border-r-4 border-l-4"></div>
                    </div>

                    <div className="absolute top-0 left-0 right-0 p-2 md:p-6 3xl:p-12 flex justify-between items-start z-50 pointer-events-none px-safe pt-safe">
                        <div className="bg-white/95 p-2 md:p-4 rounded-2xl shadow-xl border-b-4 border-blue-400 min-w-[70px] 3xl:min-w-[150px] text-center transform scale-90 md:scale-100 3xl:scale-150 landscape:scale-[0.55] landscape:origin-top-left">
                            <div className="text-[10px] 3xl:text-base text-gray-500 uppercase font-bold tracking-tight">Score</div>
                            <div className="text-xl md:text-3xl 3xl:text-5xl text-blue-600 font-black leading-none">{score}</div>
                        </div>

                        <div className="flex gap-2 bg-white/95 p-2 3xl:p-6 rounded-full shadow-lg border-2 border-white landscape:scale-[0.55] landscape:origin-top">
                            {[...Array(MAX_MISSES)].map((_, i) => (
                                <Heart key={i} className={`w-6 h-6 md:w-8 md:h-8 ${i < (MAX_MISSES - missed) ? 'text-red-500' : 'text-gray-300'}`} />
                            ))}
                        </div>

                        <div className="flex gap-2 items-start pointer-events-auto landscape:scale-[0.55] landscape:origin-top-right 3xl:scale-150">
                            <div className="bg-white/95 p-2 md:p-4 rounded-2xl shadow-xl border-b-4 border-red-300 min-w-[70px] 3xl:min-w-[150px] text-center">
                                <div className="text-[10px] 3xl:text-base text-gray-500 uppercase font-bold tracking-tight">Level</div>
                                <div className="text-xl md:text-3xl 3xl:text-5xl text-red-600 font-black leading-tight">{level}</div>
                            </div>
                            <button onClick={toggleFullScreen} className="bg-white/95 p-3 rounded-xl shadow-lg border-2 border-white text-gray-600 active:scale-90">
                                {isFullscreen ? <Minimize className="w-6 h-6" /> : <Maximize className="w-6 h-6" />}
                            </button>
                        </div>
                    </div>

                    <div className="absolute inset-0 flex justify-center z-10 pointer-events-none">
                        <div className="relative w-full max-lg:max-w-[85vw] md:max-w-xl landscape:max-w-md 3xl:max-w-5xl h-full">
                            {items.map(item => (
                                <div key={item.id} className="absolute left-0 w-1/3 flex flex-col items-center" style={{ top: `${item.y}%`, left: `${item.lane * 33.33}%` }}>
                                    <div className="bg-white/90 px-2 py-1 rounded-lg text-[9px] md:text-xs 3xl:text-xl font-bold text-gray-700 shadow-sm border border-blue-100 whitespace-nowrap mb-1">
                                        {item.text}
                                    </div>
                                    <div className={`${item.color} p-1.5 md:p-3 rounded-full shadow-lg border-2 border-white w-10 h-10 md:w-16 md:h-16 3xl:w-24 3xl:h-24 flex items-center justify-center`}>
                                        {item.icon}
                                    </div>
                                </div>
                            ))}

                            <div className="absolute transition-all duration-200 ease-out w-1/3 flex justify-center" style={{ left: `${lane * 33.33}%`, bottom: `${100 - CAR_Y_POS - 5}%` }}>
                                <div className="relative transform scale-75 md:scale-100 landscape:scale-[0.45] landscape:md:scale-[0.55] 3xl:scale-150 origin-bottom">
                                    <div className="w-16 h-24 md:w-20 md:h-32 bg-red-500 rounded-3xl shadow-xl relative border-b-8 border-red-700 z-10 flex flex-col items-center justify-center">
                                        <div className="w-[80%] h-8 bg-blue-300 rounded-lg mb-2 border-2 border-blue-400/50"></div>
                                        <div className="w-8 h-4 border-b-4 border-white rounded-full"></div>
                                    </div>
                                    <div className="absolute -left-2 top-4 w-4 h-8 bg-black rounded-l-lg"></div>
                                    <div className="absolute -right-2 top-4 w-4 h-8 bg-black rounded-r-lg"></div>
                                    <div className="absolute -left-2 bottom-4 w-4 h-8 bg-black rounded-l-lg"></div>
                                    <div className="absolute -right-2 bottom-4 w-4 h-8 bg-black rounded-r-lg"></div>
                                    <div className="absolute top-1 left-2 w-3 h-3 bg-yellow-200 rounded-full animate-pulse"></div>
                                    <div className="absolute top-1 right-2 w-3 h-3 bg-yellow-200 rounded-full animate-pulse"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {gameState === 'countdown' && (
                        <div className="absolute inset-0 z-[100] flex items-center justify-center pointer-events-none">
                            <div key={count} className="animate-pop text-8xl md:text-[12rem] 3xl:text-[20rem] font-black text-yellow-400 drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)]">
                                {count > 0 ? count : "GO!"}
                            </div>
                        </div>
                    )}

                    {feedback && (
                        <div className="absolute top-1/4 z-[90] flex justify-center pointer-events-none animate-pop px-4">
                            <div className="bg-green-500 px-6 py-3 3xl:px-12 3xl:py-6 rounded-full text-xl md:text-3xl 3xl:text-6xl font-black text-white shadow-2xl border-4 border-white">
                                {feedback.text}
                            </div>
                        </div>
                    )}

                    {gameState === 'start' && (
                        <div className="absolute inset-0 bg-blue-600/90 z-[200] flex flex-col items-center justify-center p-4 text-center backdrop-blur-sm overflow-y-auto px-safe">
                            <div className="bg-white p-6 md:p-10 3xl:p-20 rounded-[2.5rem] shadow-2xl max-w-sm md:max-w-lg 3xl:max-w-4xl w-full animate-pop border-b-8 border-gray-100 max-h-[95vh] overflow-y-auto landscape:max-h-full landscape:py-4">
                                <div className="flex justify-center mb-2 md:mb-4 landscape:hidden 3xl:flex">
                                    <Trophy className="w-12 h-12 md:w-16 md:h-16 3xl:w-24 3xl:h-24 text-yellow-500 animate-bounce" />
                                </div>
                                <h1 className="text-4xl md:text-7xl 3xl:text-9xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 mb-2 md:mb-4 animate-title leading-tight">
                                    KINDNESS<br/>CRUISER
                                </h1>
                                <div className="mb-4 md:mb-8 space-y-1">
                                    <p className="text-gray-500 font-bold 3xl:text-2xl">Catch the good habits!</p>
                                    <p className="text-lg md:text-2xl 3xl:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 via-pink-500 to-red-500 animate-pulse">
                                        Don't let 3 habits slip away!
                                    </p>
                                </div>
                                <button onClick={() => setGameState('countdown')} className="w-full bg-green-500 hover:bg-green-600 text-white text-xl md:text-2xl 3xl:text-5xl font-black py-3 md:py-5 rounded-2xl shadow-lg border-b-4 border-green-700 active:translate-y-1 active:border-b-0 transition-all flex items-center justify-center gap-3">
                                    <PlayIcon className="w-6 h-6 md:w-8 md:h-8 3xl:w-12 3xl:h-12" /> START
                                </button>
                            </div>
                        </div>
                    )}

                    {gameState === 'gameover' && (
                        <div className="absolute inset-0 bg-purple-600/90 z-[200] flex flex-col items-center justify-center p-4 text-center backdrop-blur-sm overflow-y-auto px-safe">
                            <div className="bg-white p-6 md:p-10 3xl:p-20 rounded-[2.5rem] shadow-2xl max-w-sm md:max-w-lg 3xl:max-w-4xl w-full animate-pop border-b-8 border-purple-200 max-h-[95vh] overflow-y-auto landscape:max-h-full landscape:py-4">
                                <div className="landscape:hidden 3xl:block mb-2 md:mb-4">
                                    <Heart className="w-12 h-12 md:w-16 md:h-16 3xl:w-24 3xl:h-24 text-green-500 mx-auto animate-pulse" />
                                </div>
                                <h2 className="text-xl md:text-2xl 3xl:text-5xl font-black text-gray-800 mb-4 md:mb-6">{finalMessage}</h2>
                                <div className="bg-blue-50 p-4 md:p-6 rounded-2xl mb-4 md:mb-8">
                                    <div className="text-[10px] md:text-xs 3xl:text-xl text-gray-400 uppercase font-bold">Final Score</div>
                                    <div className="text-4xl md:text-5xl 3xl:text-8xl font-black text-blue-600 leading-tight">{score}</div>
                                </div>
                                <button onClick={resetGame} className="w-full bg-blue-500 hover:bg-blue-600 text-white text-lg md:text-xl 3xl:text-5xl font-black py-3 md:py-4 rounded-2xl shadow-lg border-b-4 border-blue-700 active:translate-y-1 transition-all flex items-center justify-center gap-3">
                                    <RotateCcw className="w-6 h-6 3xl:w-12 3xl:h-12" /> PLAY AGAIN
                                </button>
                            </div>
                        </div>
                    )}

                    {gameState === 'playing' && (
                        <div className="absolute inset-x-0 bottom-0 pb-safe z-50 flex justify-center gap-4 p-4 landscape:p-2 3xl:p-12">
                            <button 
                                onPointerDown={() => setLane(l => Math.max(0, l - 1))}
                                className="flex-1 max-w-[200px] 3xl:max-w-[400px] h-20 md:h-24 landscape:h-12 3xl:h-40 bg-white/20 backdrop-blur-md rounded-2xl border-2 border-white/50 shadow-lg active:bg-white/40 active:scale-95 transition-all flex items-center justify-center"
                            >
                                <div className="w-0 h-0 border-y-[12px] md:border-y-[20px] 3xl:border-y-[40px] border-y-transparent border-r-[20px] md:border-r-[30px] 3xl:border-r-[60px] border-r-white"></div>
                            </button>
                            <button 
                                onPointerDown={() => setLane(l => Math.min(2, l + 1))}
                                className="flex-1 max-w-[200px] 3xl:max-w-[400px] h-20 md:h-24 landscape:h-12 3xl:h-40 bg-white/20 backdrop-blur-md rounded-2xl border-2 border-white/50 shadow-lg active:bg-white/40 active:scale-95 transition-all flex items-center justify-center"
                            >
                                <div className="w-0 h-0 border-y-[12px] md:border-y-[20px] 3xl:border-y-[40px] border-y-transparent border-l-[20px] md:border-l-[30px] 3xl:border-l-[60px] border-l-white"></div>
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
