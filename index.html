<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Kindness Cruiser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #fecaca;
            touch-action: none;
            overscroll-behavior: none;
            font-family: 'Fredoka One', cursive;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes titleBounce {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(5deg); }
            70% { transform: scale(0.95) rotate(-3deg); }
            100% { transform: scale(1) rotate(-2deg); opacity: 1; }
        }
        .animate-title {
            animation: titleBounce 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
        .game-height {
            height: 100dvh;
        }
        .fluid-title { font-size: clamp(2rem, 10vh, 8rem); }
        .fluid-subtitle { font-size: clamp(1rem, 4vh, 3rem); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const MAX_MISSES = 3;
        const LANE_COUNT = 3;
        const CAR_Y_POS = 82;

        const GOOD_HABITS_BANK = ["Clean my room", "Be nice", "Shower everyday", "Sit upright", "Eat healthy", "Brush teeth", "Share toys", "Say please", "Eat veggies", "Help Mom", "Do homework", "Be kind", "Listen well", "Help Dad", "Drink water", "Read books", "Say thank you", "Wash hands", "Make bed", "Feed pets", "Smile big", "Be brave", "Tell truth", "Recycle", "Plant trees"];
        const BAD_DEEDS_BANK = ["Be rude", "Dont help mom", "Eat anything", "Eat a lot", "Say bad words", "Dont help friends", "Talk to strangers", "Littering", "Shouting", "Being mean", "Ignoring rules", "Wasting food", "Not sharing", "Telling lies"];

        const BAD_DEEDS_ADVICE = {
            "Be rude": "Being rude hurts others' feelings. Always try to use your kindest words!",
            "Dont help mom": "Helping mom shows her you care. We should always help our family at home!",
            "Eat anything": "Eating the wrong things can make you sick. Be careful and stay healthy!",
            "Eat a lot": "Eating too much can make your tummy hurt. Balance is very important!",
            "Say bad words": "Bad words aren't kind. Use your voice to spread happy and polite words!",
            "Dont help friends": "Helping friends makes you a great friend. Always be there for them!",
            "Talk to strangers": "It's safer to only talk to people you know and trust. Always stay near parents!",
            "Littering": "Trash belongs in the bin to keep our world beautiful and healthy!",
            "Shouting": "Shouting can be loud and scary for others. Try using your polite inside voice!",
            "Being mean": "Being mean makes everyone sad. Kindness is a superpower that makes everyone smile!",
            "Ignoring rules": "Rules keep us safe and happy. Let's try our best to follow them!",
            "Wasting food": "Food is special. Only take what you need!",
            "Not sharing": "Sharing makes playing with others much more fun. It shows that you care!",
            "Telling lies": "Telling the truth builds trust. It is always better to be honest!"
        };

        const PRAISE_BANK = ["GREAT JOB!", "NICE!", "OH WOW!", "YES!", "SUPER!", "AMAZING!", "WAY TO GO!", "AWESOME!", "YOU ROCK!", "PERFECT!", "CHAMPION!", "KIND HEART!"];

        const Heart = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="currentColor" className={className}>
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
            </svg>
        );
        const Star = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="currentColor" className={className}>
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
            </svg>
        );
        const Book = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="currentColor" className={className}>
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
            </svg>
        );
        const Sun = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="currentColor" className={className}>
                <circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" />
            </svg>
        );

        const ICON_POOL = [
            { id: 'heart', comp: Heart },
            { id: 'star', comp: Star },
            { id: 'book', comp: Book },
            { id: 'sun', comp: Sun }
        ];

        const shuffle = (arr) => {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        };

        const CarIcon = ({ sizeClass, rotated = false }) => (
            <div className={`relative ${sizeClass} origin-center ${rotated ? 'rotate-180' : ''}`}>
                <div className="w-full h-full bg-red-500 rounded-3xl shadow-2xl relative border-b-8 border-red-700 z-10 flex flex-col items-center justify-center overflow-hidden">
                    <div className="w-[80%] h-[25%] bg-blue-300 rounded-lg mb-2 border-2 border-blue-400/50"></div>
                    <div className="w-[40%] h-[12%] border-b-4 border-white rounded-full"></div>
                </div>
                <div className="absolute -left-[10%] top-[20%] w-[10%] h-[25%] bg-black rounded-l-lg"></div>
                <div className="absolute -right-[10%] top-[20%] w-[10%] h-[25%] bg-black rounded-r-lg"></div>
                <div className="absolute -left-[10%] bottom-[20%] w-[10%] h-[25%] bg-black rounded-l-lg"></div>
                <div className="absolute -right-[10%] bottom-[20%] w-[10%] h-[25%] bg-black rounded-r-lg"></div>
                <div className="absolute top-[5%] left-[10%] w-[15%] h-[10%] bg-yellow-200 rounded-full animate-pulse"></div>
                <div className="absolute top-[5%] right-[10%] w-[15%] h-[10%] bg-yellow-200 rounded-full animate-pulse"></div>
            </div>
        );

        function App() {
            const [gameState, setGameState] = useState('start');
            const [count, setCount] = useState(3);
            const [lane, setLane] = useState(1);
            const [items, setItems] = useState([]);
            const [score, setScore] = useState(0);
            const [missed, setMissed] = useState(0);
            const [feedback, setFeedback] = useState(null);
            const [level, setLevel] = useState(1);
            const [finalMessage, setFinalMessage] = useState("");
            const [isFullscreen, setIsFullscreen] = useState(false);

            const goodPool = useRef([]);
            const badPool = useRef([]);
            const gameLoopRef = useRef();
            const lastSpawnRef = useRef(0);

            const resetGame = useCallback(() => {
                setScore(0);
                setMissed(0);
                setLevel(1);
                setItems([]);
                setLane(1);
                setCount(3);
                goodPool.current = shuffle(GOOD_HABITS_BANK);
                badPool.current = shuffle(BAD_DEEDS_BANK);
                setGameState('countdown');
            }, []);

            const toggleFullScreen = useCallback(() => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            }, []);

            useEffect(() => {
                const handleFsChange = () => setIsFullscreen(!!document.fullscreenElement);
                document.addEventListener('fullscreenchange', handleFsChange);
                return () => document.removeEventListener('fullscreenchange', handleFsChange);
            }, []);

            useEffect(() => {
                if (gameState === 'countdown') {
                    if (count > 0) {
                        const t = setTimeout(() => setCount(c => c - 1), 1000);
                        return () => clearTimeout(t);
                    } else {
                        const t = setTimeout(() => setGameState('playing'), 1000);
                        return () => clearTimeout(t);
                    }
                }
            }, [gameState, count]);

            const updateGame = useCallback((timestamp) => {
                if (gameState !== 'playing') return;

                const spawnRate = Math.max(1200, 3600 - (level * 250));
                const isWayClear = !items.some(item => item.y < 45);

                if (timestamp - lastSpawnRef.current > spawnRate && isWayClear) {
                    const selectedLane = Math.floor(Math.random() * LANE_COUNT);
                    const isSpawningBad = Math.random() < 0.3;
                    const iconChoice = ICON_POOL[Math.floor(Math.random() * ICON_POOL.length)];
                    
                    let habit, colorClass, iconColor;
                    if (isSpawningBad) {
                        if (badPool.current.length === 0) badPool.current = shuffle(BAD_DEEDS_BANK);
                        habit = badPool.current.pop();
                        colorClass = 'bg-red-100';
                        iconColor = 'text-red-500';
                    } else {
                        if (goodPool.current.length === 0) goodPool.current = shuffle(GOOD_HABITS_BANK);
                        habit = goodPool.current.pop();
                        const gColors = ['bg-blue-100', 'bg-yellow-100', 'bg-green-100'];
                        const gIconColors = ['text-blue-500', 'text-yellow-500', 'text-green-500'];
                        const idx = Math.floor(Math.random() * 3);
                        colorClass = gColors[idx];
                        iconColor = gIconColors[idx];
                    }
                    
                    setItems(prev => [...prev, {
                        id: Math.random(),
                        lane: selectedLane,
                        y: -15,
                        text: habit,
                        Icon: iconChoice.comp,
                        color: colorClass,
                        iconColor: iconColor,
                        isBad: isSpawningBad,
                        score: isSpawningBad ? 0 : 10 + (level * 2)
                    }]);
                    lastSpawnRef.current = timestamp;
                }

                setItems(prev => {
                    const next = [];
                    let missedGoodCount = 0;
                    let hitBadDeed = false;
                    const speed = 0.12 + (level * 0.08);

                    prev.forEach(item => {
                        const nextY = item.y + speed;
                        const isPortrait = window.innerHeight > window.innerWidth;
                        const frontBumper = isPortrait ? (CAR_Y_POS - 14) : (CAR_Y_POS - 18);
                        const hit = nextY > frontBumper && nextY < (CAR_Y_POS - 2) && item.lane === lane;

                        if (hit) {
                            if (item.isBad) {
                                hitBadDeed = true;
                                setFinalMessage(BAD_DEEDS_ADVICE[item.text] || "Always stay away from bad deeds!");
                                setGameState('gameover');
                            } else {
                                setFeedback({ text: PRAISE_BANK[Math.floor(Math.random() * PRAISE_BANK.length)], color: 'bg-green-500' });
                                setScore(s => {
                                    const ns = s + item.score;
                                    if (Math.floor(ns / 150) > Math.floor(s / 150)) setLevel(l => Math.min(10, l + 1));
                                    return ns;
                                });
                            }
                        } else if (nextY > 105) {
                            if (!item.isBad) missedGoodCount++;
                        } else {
                            next.push({ ...item, y: nextY });
                        }
                    });

                    if (!hitBadDeed && missedGoodCount > 0) {
                        setMissed(m => {
                            const total = m + missedGoodCount;
                            if (total >= MAX_MISSES) {
                                setFinalMessage("You missed too many good deeds! Try to catch them all next time.");
                                setGameState('gameover');
                            }
                            return total;
                        });
                    }
                    return next;
                });
                gameLoopRef.current = requestAnimationFrame(updateGame);
            }, [gameState, lane, level, items]);

            useEffect(() => {
                if (gameState === 'playing') {
                    lastSpawnRef.current = 0;
                    gameLoopRef.current = requestAnimationFrame(updateGame);
                }
                return () => cancelAnimationFrame(gameLoopRef.current);
            }, [gameState, updateGame]);

            useEffect(() => {
                if (feedback) {
                    const t = setTimeout(() => setFeedback(null), 1000);
                    return () => clearTimeout(t);
                }
            }, [feedback]);

            return (
                <div className={`relative w-full game-height overflow-hidden select-none touch-none flex justify-center transition-colors duration-700 ${gameState === 'playing' ? 'bg-blue-200' : 'bg-red-200'}`}>
                    <div className="absolute inset-y-0 left-0 w-4 sm:w-16 md:w-24 lg:w-48 bg-green-500 z-0"></div>
                    <div className="absolute inset-y-0 right-0 w-4 sm:w-16 md:w-24 lg:w-48 bg-green-500 z-0"></div>
                    <div className="relative w-full max-w-[85vw] sm:max-w-md md:max-w-xl lg:max-w-2xl h-full bg-gray-700 border-x-4 border-white z-0">
                        <div className="absolute inset-0 flex justify-between px-[33.33%] border-dashed border-white/30 border-r-4 border-l-4"></div>
                    </div>

                    {/* GLOBAL FULL SCREEN TOGGLE - PERSISTENT Z-INDEX */}
                    <div className="absolute top-0 right-0 p-4 sm:p-6 z-[300] pointer-events-auto px-safe pt-safe">
                        <button 
                            onClick={toggleFullScreen} 
                            className="bg-white/95 p-3 rounded-xl shadow-lg border-2 border-white text-gray-600 active:scale-90 transition-transform flex items-center justify-center hover:bg-gray-50"
                            title="Toggle Full Screen"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" className="w-6 h-6">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
                            </svg>
                        </button>
                    </div>

                    {/* HUD */}
                    <div className="absolute top-0 left-0 right-0 p-4 sm:p-6 z-50 flex justify-between items-start pointer-events-none w-full max-w-5xl mx-auto px-safe">
                        <div className="bg-white/95 p-2 px-4 rounded-2xl shadow-xl border-b-4 border-blue-400 text-center transform scale-90 sm:scale-100 lg:scale-110">
                            <div className="text-[10px] uppercase font-bold tracking-tight text-gray-500">Score</div>
                            <div className="text-xl sm:text-3xl font-black text-blue-600 leading-tight">{score}</div>
                        </div>

                        <div className="flex gap-2 bg-white/95 p-2 px-4 rounded-full shadow-lg border-2 border-white scale-90 sm:scale-100 lg:scale-110">
                            {[...Array(MAX_MISSES)].map((_, i) => (
                                <Heart key={i} className={`w-6 h-6 md:w-8 md:h-8 ${i < (MAX_MISSES - missed) ? 'text-red-500' : 'text-gray-300'}`} />
                            ))}
                        </div>

                        <div className="flex gap-2 items-start opacity-0 sm:opacity-100">
                             {/* Level indicator placeholder to maintain layout spacing in HUD */}
                             <div className="bg-white/95 p-2 md:p-4 rounded-2xl shadow-xl border-b-4 border-red-300 min-w-[70px] 3xl:min-w-[150px] text-center pointer-events-none">
                                <div className="text-[10px] 3xl:text-base text-gray-500 uppercase font-bold tracking-tight">Level</div>
                                <div className="text-xl md:text-3xl 3xl:text-5xl text-red-600 font-black leading-tight">{level}</div>
                            </div>
                        </div>
                    </div>

                    {/* Gameplay Elements */}
                    <div className="absolute inset-0 flex justify-center z-10 pointer-events-none">
                        <div className="relative w-full max-w-[85vw] sm:max-w-md md:max-w-xl lg:max-w-2xl h-full">
                            {items.map(item => (
                                <div key={item.id} className="absolute left-0 w-1/3 flex flex-col items-center" style={{ top: `${item.y}%`, left: `${item.lane * 33.33}%` }}>
                                    <div className="bg-white/90 px-3 py-1 rounded-lg text-sm sm:text-lg lg:text-xl font-black text-gray-800 shadow-md border border-blue-200 whitespace-nowrap mb-1">
                                        {item.text}
                                    </div>
                                    <div className={`${item.color} p-2 rounded-full shadow-lg border-2 border-white w-10 h-10 sm:w-14 sm:h-14 lg:w-20 lg:h-20 flex items-center justify-center`}>
                                        <item.Icon className={`w-full h-full ${item.iconColor}`} />
                                    </div>
                                </div>
                            ))}
                            <div className="absolute transition-all duration-200 ease-out w-1/3 flex justify-center" style={{ left: `${lane * 33.33}%`, bottom: `${100 - CAR_Y_POS - 5}%` }}>
                                <CarIcon sizeClass="w-16 h-24 sm:w-20 sm:h-32 lg:w-28 lg:h-44" />
                            </div>
                        </div>
                    </div>

                    {/* Countdown Overlay */}
                    {gameState === 'countdown' && (
                        <div className="absolute inset-0 z-[100] flex items-center justify-center pointer-events-none">
                            <div key={count} className="animate-pop text-8xl sm:text-[12rem] lg:text-[16rem] font-black text-yellow-400 drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)]">
                                {count > 0 ? count : "GO!"}
                            </div>
                        </div>
                    )}

                    {/* Feedback Popup */}
                    {feedback && (
                        <div className="absolute top-1/4 z-[90] flex justify-center pointer-events-none animate-pop px-4 w-full">
                            <div className={`${feedback.color || 'bg-green-500'} px-6 py-3 rounded-full text-xl sm:text-4xl lg:text-5xl font-black text-white shadow-2xl border-4 border-white whitespace-nowrap mx-auto`}>
                                {feedback.text}
                            </div>
                        </div>
                    )}

                    {/* START SCREEN */}
                    {gameState === 'start' && (
                        <div className="absolute inset-0 bg-red-700/90 z-[200] flex flex-col items-center justify-center p-4 backdrop-blur-sm overflow-hidden">
                            <div className="bg-white p-4 sm:p-8 rounded-[2.5rem] shadow-2xl max-w-sm md:max-w-xl lg:max-w-3xl w-full h-[98dvh] flex flex-col items-center justify-between animate-pop border-b-8 border-gray-100 overflow-hidden py-10">
                                <div className="flex-none text-center">
                                    <h1 className="fluid-title font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-pink-500 to-red-600 animate-title leading-tight">
                                        KINDNESS<br/>CRUISER
                                    </h1>
                                </div>
                                <div className="flex-grow flex items-center justify-center min-h-0">
                                    <CarIcon sizeClass="h-[15vh] sm:h-[20vh] lg:h-[25vh] aspect-[2/3] drop-shadow-xl" />
                                </div>
                                <div className="flex-none text-center px-4">
                                    <p className="fluid-subtitle font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 via-pink-500 to-red-500 animate-pulse tracking-wide leading-snug">
                                        Catch good habits!<br/>Avoid bad habits!
                                    </p>
                                </div>
                                <div className="flex-none w-full flex justify-center pt-4">
                                    <button 
                                      onClick={() => setGameState('countdown')} 
                                      className="w-full max-w-[280px] md:max-w-md bg-gradient-to-r from-red-500 to-pink-600 hover:from-red-600 hover:to-pink-700 text-white text-2xl sm:text-4xl lg:text-5xl font-black py-4 lg:py-6 rounded-[2rem] shadow-xl border-b-8 border-red-800 active:translate-y-1 active:border-b-0 transition-all flex items-center justify-center gap-4"
                                    >
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className="w-8 h-8 lg:w-12 lg:h-12"><polygon points="5 3 19 12 5 21 5 3" /></svg> START
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* GAME OVER SCREEN */}
                    {gameState === 'gameover' && (
                        <div className="absolute inset-0 bg-red-700/95 z-[200] flex flex-col items-center justify-center p-4 backdrop-blur-sm overflow-hidden px-safe">
                            <div className="bg-white p-6 sm:p-10 rounded-[3rem] shadow-2xl max-w-sm sm:max-w-xl md:max-w-2xl w-full h-[98dvh] flex flex-col items-center justify-between animate-pop border-b-8 border-red-200 py-10">
                                <div className="flex flex-col items-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="w-16 h-16 lg:w-24 lg:h-24 text-red-500 mb-4 animate-pulse">
                                        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
                                        <line x1="12" y1="9" x2="12" y2="13" />
                                        <line x1="12" y1="17" x2="12.01" y2="17" />
                                    </svg>
                                    <h2 className="text-xl sm:text-3xl lg:text-5xl font-black text-gray-800 leading-relaxed text-center px-4">
                                        {finalMessage}
                                    </h2>
                                </div>
                                <div className="bg-red-50 p-6 rounded-[2rem] w-full max-w-xs sm:max-w-md text-center">
                                    <div className="text-[10px] uppercase font-bold text-gray-400 mb-2 tracking-widest">Final Score</div>
                                    <div className="text-6xl sm:text-8xl font-black text-red-600">{score}</div>
                                </div>
                                <button 
                                    onClick={() => setGameState('start')} 
                                    className="w-full max-w-md bg-gradient-to-r from-red-500 to-pink-600 hover:from-red-600 hover:to-pink-700 text-white text-xl md:text-3xl lg:text-4xl font-black py-4 lg:py-6 rounded-[2rem] shadow-xl border-b-8 border-red-800 active:translate-y-1 transition-all flex items-center justify-center gap-4"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" className="w-8 h-8"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></svg> PLAY AGAIN
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Gameplay Controls */}
                    {gameState === 'playing' && (
                        <div className="absolute inset-x-0 bottom-0 pb-safe z-50 flex justify-center gap-4 p-4 lg:p-12">
                            <button 
                                onPointerDown={(e) => { e.preventDefault(); setLane(l => Math.max(0, l - 1)); }}
                                className="flex-1 max-w-[150px] sm:max-w-[200px] lg:max-w-[300px] h-20 sm:h-24 lg:h-36 bg-white/20 backdrop-blur-md rounded-3xl border-2 border-white/50 shadow-lg active:bg-white/40 active:scale-95 transition-all flex items-center justify-center"
                            >
                                <div className="w-0 h-0 border-y-[15px] sm:border-y-[20px] lg:border-y-[30px] border-r-[25px] sm:border-r-[35px] lg:border-r-[50px] border-y-transparent border-r-white"></div>
                            </button>
                            <button 
                                onPointerDown={(e) => { e.preventDefault(); setLane(l => Math.min(2, l + 1)); }}
                                className="flex-1 max-w-[150px] sm:max-w-[200px] lg:max-w-[300px] h-20 sm:h-24 lg:h-36 bg-white/20 backdrop-blur-md rounded-3xl border-2 border-white/50 shadow-lg active:bg-white/40 active:scale-95 transition-all flex items-center justify-center"
                            >
                                <div className="w-0 h-0 border-y-[15px] sm:border-y-[20px] lg:border-y-[30px] border-l-[25px] sm:border-l-[35px] lg:border-l-[50px] border-y-transparent border-l-white"></div>
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
